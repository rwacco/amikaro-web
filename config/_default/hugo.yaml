# Hugo configuration file
title: Amikaro
baseURL: https://www.amikaro.nl/

defaultContentLanguage: nl

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra


languages:
  nl:
    label: Nederlands
    weight: 1
    menu:
      main:
        - name: Over ons
          pageRef: /over/
          weight: 1
        - name: Aanmelden
          pageRef: /aanmelden/
          weight: 2
        - name: Language Switcher
          params:
            type: language-switch
            label: true # optional, default is false
  en:
    label: English
    weight: 2
    menu:
      main:
        - name: About us
          pageRef: /about/
          weight: 1
        - name: Register
          pageRef: /registration/
          weight: 2
        - name: Language Switcher
          params:
            type: language-switch
            label: true # optional, default is false
  eo:
    label: Esperanto
    weight: 3
    menu:
      main:
        - name: Pri ni
          pageRef: /pri/
          weight: 1
        - name: Aliĝi
          pageRef: /aliĝi/
          weight: 2
        - name: Language Switcher
          params:
            type: language-switch
            label: true # optional, default is false

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
        title: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

params:
  navbar:
    displayTitle: false
    displayLogo: true
    logo:
      path: images/logo.png
      dark: images/logo-dark.png
      link: /
      width: 125
      height: 35
  
  meta:
    favicon: true

  theme:
    default: light
    displayToggle: false

  footer:
    displayCopyright: false
    displayPoweredBy: false

  editURL:
    enable: false
    base: "https://github.com/imfing/hextra-starter-template/edit/main/content"


